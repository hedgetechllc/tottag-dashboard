name: Browser tool

# Runs the browser tool's whole gate on every push and pull request, and publishes the result from
# main to GitHub Pages. The custom domain, app.tottag.net, is set in the repository's Pages settings.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Let a running deployment finish rather than cancelling it part-way.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The drift and parity checks read the firmware from the external/socitrack submodule.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Web/package-lock.json

      - name: Check and build the browser tool
        working-directory: Web
        run: |
          npm ci
          npm run ci

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Web/app/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
