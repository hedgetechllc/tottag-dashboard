name: TotTag Helper release

# Builds the TotTag Helper's installers and, for a tottag-helper-v* tag, publishes them as a
# GitHub release:
#
#   TotTag-Helper-macOS.pkg        TotTag Helper.app, universal, signed and notarized
#   TotTag-Helper-Windows.exe      per-user installer, x64 and ARM64, signed by SignPath
#   tottag-helper_{amd64,arm64}.deb, tottag-helper_linux_{amd64,arm64}.tar.gz
#
# Asset names carry no version, so the dashboard can link to releases/latest/download/<name>.
#
# The unit tests are not run again here: npm run release:helper tags only a helper the
# TotTag Helper workflow has already passed on GitHub (tottag-helper.yml). Each installer is
# installed on its runner, though, and asked whether everything is in place.
#
# Signing credentials live in the tottag-helper-release environment, which only
# tottag-helper-v* tags can deploy to; Web/tottag-helper/packaging/setup-signing.sh puts them
# there. Anything not configured is skipped with a warning, so a manual run from any branch makes
# unsigned test builds without touching a secret.

on:
  push:
    tags: ['tottag-helper-v*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # SignPath reads the run to verify where the artifact came from

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          case "$GITHUB_REF" in
            refs/tags/tottag-helper-v*) echo "version=${GITHUB_REF#refs/tags/tottag-helper-v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT" ;;
          esac

  macos:
    needs: [version]
    runs-on: macos-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/tottag-helper-v') && 'tottag-helper-release' || '' }}
    defaults:
      run:
        working-directory: Web/tottag-helper
    env:
      HAS_CERTS: ${{ secrets.MACOS_CERTS_P12 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: Web/tottag-helper/go.mod
          cache: false
      - name: Import signing identities
        if: env.HAS_CERTS == 'true'
        env:
          MACOS_CERTS_P12: ${{ secrets.MACOS_CERTS_P12 }}
          MACOS_CERTS_PASSWORD: ${{ secrets.MACOS_CERTS_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$MACOS_CERTS_P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security import "$RUNNER_TEMP/certs.p12" -k "$KEYCHAIN" -P "$MACOS_CERTS_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          rm -f "$RUNNER_TEMP/certs.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # The new keychain first, then the runner's own, one word each.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
      - name: Build, sign and notarize
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          fi
          packaging/macos/build-pkg.sh "${{ needs.version.outputs.version }}" dist
          rm -f "$RUNNER_TEMP/AuthKey.p8"
      - name: Check the package installs and answers
        run: |
          sudo installer -pkg dist/TotTag-Helper-macOS.pkg -target /
          APP="/Library/Application Support/TotTag/TotTag Helper.app"
          codesign -dv "$APP" 2>&1 | grep -E '^(Identifier|Format|TeamIdentifier)='
          "$APP/Contents/MacOS/tottag-helper" version
          cat /Library/Google/Chrome/NativeMessagingHosts/net.tottag.helper.json
          "$APP/Contents/MacOS/tottag-helper" doctor
          if [ "$HAS_CERTS" = true ]; then spctl --assess --type install --verbose dist/TotTag-Helper-macOS.pkg; fi
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: Web/tottag-helper/dist/TotTag-Helper-macOS.pkg

  linux:
    needs: [version]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Web/tottag-helper
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: Web/tottag-helper/go.mod
          cache: false
      - run: packaging/linux/build-deb.sh "${{ needs.version.outputs.version }}" dist
      - name: Check the package installs and answers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ./dist/tottag-helper_amd64.deb
          tottag-helper version
          cat /etc/opt/chrome/native-messaging-hosts/net.tottag.helper.json
          tottag-helper doctor
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            Web/tottag-helper/dist/*.deb
            Web/tottag-helper/dist/*.tar.gz

  windows:
    needs: [version]
    runs-on: windows-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/tottag-helper-v') && 'tottag-helper-release' || '' }}
    defaults:
      run:
        working-directory: Web/tottag-helper
        shell: pwsh
    env:
      SIGN: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    # Until SignPath is set up the installer is built and published unsigned, and the release says so
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - id: signing
        run: '"signed=$env:SIGN" >> $env:GITHUB_OUTPUT'
        working-directory: .
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: Web/tottag-helper/go.mod
          cache: false
      - name: Build the executables
        run: ./packaging/windows/build.ps1 -Version "${{ needs.version.outputs.version }}" -Stage binaries

      # SignPath signs the executables first, so that what the installer carries is signed,
      # and then the installer itself.
      - id: unsigned-binaries
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned-binaries
          path: Web/tottag-helper/dist/windows/*.exe
      - if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: executables
          github-artifact-id: ${{ steps.unsigned-binaries.outputs.artifact-id }}
          wait-for-completion: true
          # Each request waits for an approver to accept it in SignPath.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: Web/tottag-helper/dist/windows

      - name: Build the installer
        run: ./packaging/windows/build.ps1 -Version "${{ needs.version.outputs.version }}" -Stage installer
      - id: unsigned-installer
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned-installer
          path: Web/tottag-helper/dist/TotTag-Helper-Windows.exe
      - if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: Web/tottag-helper/dist
      - if: env.SIGN != 'true'
        run: Write-Host "::warning::SignPath is not configured; the Windows installer is unsigned and SmartScreen will warn about it."
      - name: Check the installer installs and answers
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Start-Process -FilePath dist/TotTag-Helper-Windows.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          & "$env:LOCALAPPDATA\Programs\TotTag Helper\tottag-helper.exe" version
          reg query 'HKCU\Software\Google\Chrome\NativeMessagingHosts\net.tottag.helper' /ve
          & "$env:LOCALAPPDATA\Programs\TotTag Helper\tottag-helper.exe" doctor
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: Web/tottag-helper/dist/TotTag-Helper-Windows.exe

  release:
    if: startsWith(github.ref, 'refs/tags/tottag-helper-v')
    needs: [version, macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
          pattern: '{macos,linux,windows}'
      - run: cd assets && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          name: TotTag Helper ${{ needs.version.outputs.version }}
          make_latest: true
          files: assets/*
          body: |
            The native helper the TotTag dashboard uses to find TotTags over Bluetooth and reach those plugged in over USB, without the browser's device chooser. Install it, add the TotTag Helper browser extension, and reload the dashboard.

            - **macOS 13 or later**: `TotTag-Helper-macOS.pkg`. The first time the dashboard scans, macOS asks whether the TotTag Helper may use Bluetooth.
            - **Windows 10 or later**: `TotTag-Helper-Windows.exe` (installs for you only; no administrator rights needed)${{ needs.windows.outputs.signed != 'true' && '. This installer is not signed yet, so Windows may say it protected your PC: choose **More info**, then **Run anyway**.' || '' }}
            - **Debian, Ubuntu**: `tottag-helper_amd64.deb` (or `_arm64`), then `sudo apt install ./tottag-helper_amd64.deb`
            - **Other Linux**: the `.tar.gz` for your architecture; run `sudo ./install.sh`, or `./install.sh --user`

            Check an installation with `tottag-helper doctor` (on macOS, `"/Library/Application Support/TotTag/TotTag Helper.app/Contents/MacOS/tottag-helper" doctor`).

            Code signing policy: https://github.com/hedgetechllc/tottag-dashboard/blob/main/Web/tottag-helper/CODE_SIGNING_POLICY.md
